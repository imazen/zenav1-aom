name: winperf (Windows encoder A/B)

# MANUAL ONLY — zero cost per push.
#
# The regular CI matrix stays what it is; this is a measurement job, and a
# measurement job that runs on every push is both expensive and useless (nobody
# reads 300 noisy medians). Dispatch it when an encoder perf change lands, or
# when you want to re-confirm a recorded Windows number.
#
# WHY IT EXISTS
#
# benchmarks/encoder_alloc_scratch_2026-08-02.md measured the KB-PERF-2
# allocation levers at -4.641 ms total / -1.34 ms for lever 3 alone. That was an
# Apple M4 Pro against Apple's allocator. The encoder ships on Windows, whose
# default heap is a different implementation with a different cost per call, so
# a -40 % reduction in allocator traffic may be worth a different amount there —
# and the repo's only Windows job (`ci.yml`'s `portability`) *builds* the
# published crates and runs no tests and no benches, so the encoder had never
# been EXECUTED on Windows at all. This job executes it.
#
# WHAT IT DOES
#
# Builds the SAME harness (crates/aom-bench examples `winperf` + `winperf_alloc`,
# pure Rust, `--no-default-features` = no C oracle, no cmake, no nasm) FOUR times
# in ONE job, swapping crates/aom-dsp/src and crates/aom-encode/src between
# builds. Two separate CI runs are two different VMs and are not comparable, so
# every arm has to be built and interleaved inside a single runner.
#
# FIVE arms are timed, the same five the dev-box study used:
#
# Each arm is timed on EVERY content in the `contents` input (see
# `aom_bench::winperf::Content`), reported separately and never averaged.
#
# CONTENT IS PART OF THE MEASUREMENT, NOT A DETAIL OF IT.
#
#   detail  isotropic fractal noise, tuned so its ALLOCATOR CALL COUNT matches
#           the dev box's study photograph (95 %). Right for a lever that
#           touches every block regardless of how it is coded — allocation
#           (KB-PERF-2), the forward transform (KB-PERF-3).
#   smooth  the same generator, halving ladder: the low-work end of the bracket.
#   photo   ORIENTED content, fitted to the photograph's INTRA MODE
#           DISTRIBUTION instead. It exists because `detail` and `smooth` are
#           isotropic, so the encoder's DIRECTIONAL intra modes essentially
#           never win on them: measured 2026-08-03, directional predicted-pixel
#           share is 20.8 % on the photograph, 13.2 % on `smooth` and 0.15 % on
#           `detail`, where `z1` fires SIX TIMES in a whole 1 MP frame. KB-PERF-4
#           read a winperf band for a directional-intra lever off `detail` and
#           got a structural zero, not a platform result
#           (benchmarks/encoder_intra_dir_i16_2026-08-03.md §7,
#           docs/DIFFERENTIAL_PLAYBOOK.md §6b).
#
# So: dispatch with the content whose census reaches your lever. The census is
# `cargo run -p zenav1-aom-bench --features census --example content_census`,
# and benchmarks/winperf_content_census_2026-08-03.md is the committed table.
#
#   pre    578653f  — before both levers
#   l3a    +3a only — tiered forward-pass scratch (a memset lever; its scratch
#                     is a stack array, so it moves ZERO allocator calls)
#   l3     +3 only  — per-txb scratch reuse (the allocator lever, -41 % calls)
#   post   both
#   postB  both, again, from a SECOND COPY of the identical binary
#
# `l3a` and `l3` are why the two are separable: the question this job exists for
# is what the ALLOCATOR lever is worth on Windows, and `post - pre` alone cannot
# answer it because it also contains a memset lever that Darwin credited with
# two thirds of the combined win. `postB` vs `post` is the runner's NOISE FLOOR
# — the only honest thing to read a real delta against on a shared cloud VM you
# do not own. If an effect does not clear it, the honest report is "not
# resolvable", not a number.
#
# It also runs the allocator CENSUS on every arm. Call counts are exact and
# noise-free where milliseconds on a hosted runner are not, so they are the part
# of this job that is always trustworthy — and the census is what proves the
# arms are the arms they claim to be (pre and l3a must agree to the digit, l3
# and post likewise).

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Commit whose crates/aom-{dsp,encode}/src form the `pre` arm"
        required: true
        default: "578653ff30b4116e29453b414c4da0702959ed63"
      rounds:
        description: "Interleaved rounds (each = 1 invocation of each of 5 arms = 2 warm-up + 7 timed encodes)"
        required: true
        default: "12"
      arms:
        description: "kbperf2 = the 5-arm 3a/3 file split (KB-PERF-2 only). prepost = base_sha vs HEAD, for ANY landing."
        required: false
        default: "kbperf2"
      contents:
        description: "Space-separated winperf contents. `photo` is the one whose intra mode mix matches the study photograph; `detail`/`smooth` match its allocator traffic. Roughly 4-5 min of runner time each at rounds=16."
        required: false
        default: "detail smooth photo"

jobs:
  winperf:
    name: winperf ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The org-bar mandated ARM runner. Never previously ran this encoder.
          - name: windows-11-arm
            os: windows-11-arm
          # Where most Windows users actually are. Different CPU AND different
          # allocator tuning from the ARM image, so the two are reported
          # separately and never merged.
          - name: windows-x86-64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # Full history: the `pre` arm is a source checkout of an older commit.
      # No submodules — the pure-Rust surface never touches upstream/, which is
      # the whole reason this can run here.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Record the box
        shell: bash
        run: |
          set -x
          rustc -vV
          cargo -V
          uname -a || true
          systeminfo | head -20 || true
          wmic cpu get name,numberofcores,numberoflogicalprocessors /format:list || true

      # ---- post arm (the checked-out commit) --------------------------------
      - name: Build the post arm
        shell: bash
        run: |
          cargo build --release -p zenav1-aom-bench --no-default-features \
            --example winperf --example winperf_alloc
          mkdir -p bin
          cp target/release/examples/winperf.exe       bin/winperf_post.exe
          cp target/release/examples/winperf.exe       bin/winperf_postB.exe
          cp target/release/examples/winperf_alloc.exe bin/winperf_alloc_post.exe

      # ---- the three older arms --------------------------------------------
      # Only crates/aom-{dsp,encode}/src are ever swapped: 99a10ab touched
      # nothing else that is compiled into these examples, so the harness itself
      # is identical in every arm by construction. Lever 3a lives entirely in
      # crates/aom-dsp/src/transform/simd/mod.rs and changes no signature, which
      # is what makes the two levers separable by file.
      # `arms: prepost` — the generic shape, for any landing whose two sides are
      # just two commits. `pre` is a whole-src checkout of base_sha; `l3a` and
      # `l3` become extra COPIES of that same `pre` binary, so the five-arm
      # plumbing below (census loop, interleaved timing, byte gate) needs no
      # change and the run gains a null arm on the PRE side as well as the
      # post-side `postB`. Read the summary accordingly: in this mode `l3a` and
      # `l3` are nulls, not levers.
      - name: Build the pre arm (prepost mode)
        if: inputs.arms == 'prepost'
        shell: bash
        run: |
          set -x
          git checkout ${{ inputs.base_sha }} -- crates/aom-dsp/src crates/aom-encode/src
          cargo build --release -p zenav1-aom-bench --no-default-features \
            --example winperf --example winperf_alloc
          cp target/release/examples/winperf.exe       bin/winperf_pre.exe
          cp target/release/examples/winperf.exe       bin/winperf_l3a.exe
          cp target/release/examples/winperf.exe       bin/winperf_l3.exe
          cp target/release/examples/winperf_alloc.exe bin/winperf_alloc_pre.exe
          cp target/release/examples/winperf_alloc.exe bin/winperf_alloc_l3a.exe
          cp target/release/examples/winperf_alloc.exe bin/winperf_alloc_l3.exe
          git checkout HEAD -- crates/aom-dsp/src crates/aom-encode/src
          git status --porcelain

      - name: Build the pre / l3a / l3 arms
        if: inputs.arms != 'prepost'
        shell: bash
        run: |
          set -x
          # l3 = everything post EXCEPT 3a's file.
          git checkout ${{ inputs.base_sha }} -- crates/aom-dsp/src/transform/simd/mod.rs
          cargo build --release -p zenav1-aom-bench --no-default-features \
            --example winperf --example winperf_alloc
          cp target/release/examples/winperf.exe       bin/winperf_l3.exe
          cp target/release/examples/winperf_alloc.exe bin/winperf_alloc_l3.exe
          git checkout HEAD -- crates/aom-dsp/src/transform/simd/mod.rs

          # l3a = everything pre EXCEPT 3a's file.
          git checkout ${{ inputs.base_sha }} -- crates/aom-dsp/src crates/aom-encode/src
          git checkout HEAD -- crates/aom-dsp/src/transform/simd/mod.rs
          cargo build --release -p zenav1-aom-bench --no-default-features \
            --example winperf --example winperf_alloc
          cp target/release/examples/winperf.exe       bin/winperf_l3a.exe
          cp target/release/examples/winperf_alloc.exe bin/winperf_alloc_l3a.exe

          # pre = everything pre.
          git checkout ${{ inputs.base_sha }} -- crates/aom-dsp/src crates/aom-encode/src
          cargo build --release -p zenav1-aom-bench --no-default-features \
            --example winperf --example winperf_alloc
          cp target/release/examples/winperf.exe       bin/winperf_pre.exe
          cp target/release/examples/winperf_alloc.exe bin/winperf_alloc_pre.exe

          git checkout HEAD -- crates/aom-dsp/src crates/aom-encode/src
          git status --porcelain

      # ---- allocator census: exact, noise-free, the trustworthy half --------
      - name: Allocation census, every arm x every content
        shell: bash
        run: |
          for c in ${{ inputs.contents }}; do
            for a in pre l3a l3 post; do
              echo "--- $c/$a ---"
              ./bin/winperf_alloc_$a.exe $c | tee census_${c}_$a.tsv
              echo
            done
          done

      # ---- interleaved timing, five arms including the null ----------------
      #
      # ONE band per content, never averaged together. On the dev box lever 3's
      # SIGN depends on the content (-2.21 ms on the study photograph, +2.49 ms
      # on `detail`), so a platform claim taken from a single image would be a
      # claim about that image. `detail` and `smooth` bracket the photograph's
      # allocator traffic (835,638 / 291,704 pre-arm calls against its 854,053);
      # `photo` brackets its intra mode mix, which those two do not.
      - name: Interleaved timing bands
        shell: bash
        run: |
          for c in ${{ inputs.contents }}; do
            python scripts/winperf_ab.py ${{ inputs.rounds }} $c winperf_${{ matrix.name }}_$c.tsv \
              pre=./bin/winperf_pre.exe \
              l3a=./bin/winperf_l3a.exe \
              l3=./bin/winperf_l3.exe \
              post=./bin/winperf_post.exe \
              postB=./bin/winperf_postB.exe
          done

      - name: Summarise (control band FIRST, then the delta)
        shell: bash
        run: |
          {
            echo '## winperf ${{ matrix.name }}'
            for c in ${{ inputs.contents }}; do
              echo
              echo "### $c — control band + deltas vs pre"
              echo
              echo '```'
              python scripts/eprof_ab_stats.py winperf_${{ matrix.name }}_$c.tsv --vs pre
              echo '```'
              echo
              echo "### $c — null arm (postB vs post); read this before any delta"
              echo
              echo '```'
              python scripts/eprof_ab_stats.py winperf_${{ matrix.name }}_$c.tsv --vs post
              echo '```'
            done
            echo
            echo '### allocator census (exact)'
            echo
            echo '```'
            for f in census_*.tsv; do echo "--- $f ---"; cat "$f"; done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # A coding-decision change would move FRAMEBYTES. Every arm must agree,
      # and both Windows targets must agree with the Darwin value — the
      # harness's source is integer-only precisely so that holds. This is a
      # fail-loud check, not a warning: a divergence here is a portability bug
      # worth more than the timing this job came for.
      #
      # It is ALSO what lets the content census be taken once, on Darwin, and
      # quoted for these runners: identical source bytes plus identical coded
      # bytes out of a deterministic single-threaded search means identical
      # coding decisions, hence an identical mode/partition census. (The
      # allocator census is measured on all three targets and is byte-for-byte
      # equal, which is the same argument with the evidence attached.)
      #
      # The expected values are Darwin's, pinned in
      # `aom_bench::winperf`'s `synth_source_is_pinned_and_not_blank` /
      # `benchmarks/winperf_content_census_2026-08-03.md`. A content whose
      # generator changes must change here in the same commit.
      - name: Every arm must encode the same bytes
        shell: bash
        run: |
          set -e
          for c in ${{ inputs.contents }}; do
            case $c in
              detail) want=8734 ;;
              smooth) want=2302 ;;
              photo)  want=5301 ;;
              *) echo "no pinned framebytes for content $c"; exit 1 ;;
            esac
            for a in pre l3a l3 post; do
              got=$(awk -F'\t' '$1=="framebytes"{print $2}' census_${c}_$a.tsv)
              echo "$a framebytes $c=$got (expected $want)"
              test "$got" = "$want"
            done
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winperf-${{ matrix.name }}
          path: |
            winperf_${{ matrix.name }}_*.tsv
            census_*.tsv
