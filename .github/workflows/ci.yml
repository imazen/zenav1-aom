name: CI

on:
  push:
    # main plus the branch families landings are staged on. MEASURED
    # 2026-09-24: `perf/gate3-txfm-i16-batch` reached 160 commits ahead of main
    # with ZERO CI runs because only main and PRs triggered — every arch leg
    # was unverified until the fast-forward. Branch pushes cost runner minutes;
    # an unverified 160-commit fast-forward costs more.
    branches: [main, 'perf/**', 'fix/**', 'feat/**', 'integrate/**', 'maint/**']
  pull_request:
    branches: [main]
  # Manual trigger. GitHub's pull_request event delivery stalls occasionally —
  # observed here 2026-08-06 (PR #13 produced no run at all) and in
  # imazen/zenavif on 2026-07-23. Without a dispatch trigger the only recovery
  # is closing and reopening the PR, which loses review state. One line.
  workflow_dispatch:

# No cancel-in-progress: during a multi-agent wave every commit is a real
# correctness change we want independently verified, so let each run complete
# rather than cancelling on the next push. Concurrent hosted-runner jobs are
# fine; per-commit CI signal is worth the minutes for a conformance project.

env:
  # Pinned libaom oracle commit (see reference/BUILD_CONFIG.md). Bump the cache
  # key salt (-vN) when the pin or build config changes.
  LIBAOM_SHA: 03087864cf4bea6abb0d28f95cf7843511413d8f

jobs:
  test-linux:
    name: linux differential (x86-64)
    runs-on: ubuntu-latest
    # Was 5h47m then 6h00m (GitHub's hard cap, cancelled) on the debug profile.
    # MEASURED on --profile test-fast (run 30404938939): this leg 20m49s (~17x,
    # matching the 10-20x the profile's Cargo.toml comment claims), the
    # scalar-pin leg 36m19s, whole run ~36m instead of 6h — with every job green
    # and no result changed, so the profile is coverage-identical in practice as
    # well as by design. 90 leaves ~2.5x headroom over the slower of the two and
    # turns a future hang into a fast failure instead of a burned 6-hour runner
    # slot that reports as "cancelled" (which reads like a human cancelled it).
    timeout-minutes: 90
    steps:
      # `submodules: recursive` checks out the pinned libaom C oracle at
      # `upstream/`; the cargo-driven aom-sys-ref/build.rs builds it from there.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install C-oracle build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm cmake ninja-build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # Every crate links the C libaom oracle via aom-sys-ref, so the whole
      # workspace needs it built. aom-sys-ref/build.rs builds it from the
      # `upstream/` submodule into `upstream/build/`. Cache that build keyed on
      # the pinned commit — after the first run the build.rs SHA stamp skips the
      # rebuild and this restores in seconds.
      - name: Cache libaom oracle build
        uses: actions/cache@v6
        with:
          path: upstream/build
          key: libaom-${{ runner.os }}-${{ env.LIBAOM_SHA }}-v3

      - name: Build C libaom oracle (cargo-driven)
        run: cargo build -p zenav1-aom-sys-ref

      # Deterministically provision the Gate-1 conformance corpus. The workspace
      # conformance test (conformance_corpus.rs) fail-loud-asserts when
      # conformance/data/ is empty — correct (no silent skip), but non-hermetic
      # unless the corpus is actually provisioned. Fetch libaom's own sha1-pinned
      # intra-scope vectors (name+sha1 from the `upstream/` submodule's
      # test-data.sha1 manifest; bytes from storage.googleapis.com/aom-test-data).
      # Cached, keyed on the manifest, so later runs restore in seconds and
      # re-verify without re-downloading.
      - name: Cache conformance corpus
        uses: actions/cache@v6
        with:
          path: conformance/data
          key: conformance-intra-${{ runner.os }}-${{ hashFiles('upstream/test/test-data.sha1') }}-v1
      - name: Provision conformance corpus (intra scope)
        run: python3 xtask/conformance.py --fetch --scope intra

      # archmage/magetypes (SIMD dispatch) come from crates.io ("0.9.27") —
      # the former absolute-path dep + CI clone workaround was migrated per
      # its TODO (Gate-3 SIMD work needs ONE archmage instance workspace-wide
      # so the AOM_FORCE_SCALAR token pin reaches every kernel crate).

      # nextest, not `cargo test`: the workspace is ~300 test binaries that
      # `cargo test` drains ONE AT A TIME (measured 3.94 load on 24 cores);
      # nextest puts every test in one pool — 57.4 min -> 341 s locally, and
      # it is what `just gate-landing` has run since 2026-09-09.
      - name: Test workspace (differential vs C oracle)
        run: cargo nextest run --cargo-profile test-fast --workspace --no-fail-fast

      # The default-off `whereat` feature adds two located-error decode entries.
      # Nothing in `cargo test --workspace` enables it, so without this step the
      # feature is never even COMPILED and could rot unnoticed.
      #
      # It lives HERE and not on the pure-Rust portability job, where it was
      # first placed on the reasoning that `whereat` is a no_std zero-dep crate
      # so the step needs no C. True of the crate, FALSE of the invocation:
      # `cargo test -p zenav1-aom-decode` builds that package's DEV-dependencies,
      # which include `zenav1-aom-sys-ref`, whose build.rs requires nasm + cmake
      # and panics without them. Measured on run 34233972208: both
      # `windows-11-arm` and `macos-15-intel` failed with "missing C-oracle build
      # tool(s): nasm" before a single test ran. Cargo has no optional
      # dev-dependencies, so the package cannot opt out of that the way
      # `aom-bench` opts out via its `c-oracle` feature; the fix is to run it on
      # a leg that already has the oracle, which costs this job ~1 s.
      - name: Located-error entries (whereat feature)
        run: "cargo test -p zenav1-aom-decode --features whereat,__internals --test all -- whereat_entries::"

      # The cancellation-latency gate. `#[ignore]`d in the workspace run because
      # it measures WALL-CLOCK latency, which a parallel test pool cannot
      # measure; run here on its own with `--test-threads 1`, the methodology
      # its committed record was taken with. Its bounds are machine-RELATIVE
      # (`max(20 ms, 12.5 % of this machine's own cost)`), so a slow runner
      # scales the bar instead of failing it — see `MAX_TRIPWIRE_FRACTION`.
      # (Spelled out rather than `just gate-cancel-latency`: no CI job installs
      # `just`, and a step that silently needs a missing tool is worse than a
      # duplicated command line. `justfile`'s recipe is the same invocation.)
      - name: Cancellation latency (isolated timing gate)
        run: "cargo test --profile test-fast -p zenav1-aom-bench --test all -- --ignored --test-threads 1 --nocapture cancel_latency::"

  # SCALAR-PIN mode (Gate-3 parity rule 3): AOM_FORCE_SCALAR disables every
  # archmage SIMD token process-wide (aom_dsp::dispatch), so every kernel
  # dispatch falls through to `_scalar` = the transcribed C port, verbatim.
  # The FULL suite passing here proves SIMD work left the scalar path
  # untouched. Locally: `just test-scalar`.
  test-linux-scalar-pinned:
    name: linux differential (forced-scalar pin)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AOM_FORCE_SCALAR: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install C-oracle build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm cmake ninja-build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Cache libaom oracle build
        uses: actions/cache@v6
        with:
          path: upstream/build
          key: libaom-${{ runner.os }}-${{ env.LIBAOM_SHA }}-v3
      - name: Build C libaom oracle (cargo-driven)
        run: cargo build -p zenav1-aom-sys-ref
      - name: Cache conformance corpus
        uses: actions/cache@v6
        with:
          path: conformance/data
          key: conformance-intra-${{ runner.os }}-${{ hashFiles('upstream/test/test-data.sha1') }}-v1
      - name: Provision conformance corpus (intra scope)
        run: python3 xtask/conformance.py --fetch --scope intra
      - name: Test workspace under the scalar pin
        run: cargo nextest run --cargo-profile test-fast --workspace --no-fail-fast

      # The cancellation gate runs HERE as well as on the x86-64 leg, and this
      # is the leg where it has the most to say: MEASURED on run 34236344662,
      # this job's natural 4096x4096 decode is 2133 ms against ~310 ms on a
      # developer box, so its un-pollable windows are the largest anywhere in
      # CI. (That is also the measurement that made the bars machine-relative —
      # its per-CDEF-filter-block-row gaps are ~24 ms, so a flat 20 ms bar could
      # never pass here no matter how finely the decoder polled.)
      - name: Cancellation latency (isolated timing gate, scalar pin)
        run: "cargo test --profile test-fast -p zenav1-aom-bench --test all -- --ignored --test-threads 1 --nocapture cancel_latency::"

  # EXPERIMENTAL-VIDEO-ON leg (docs/HANDOFF-EXPERIMENTAL-VIDEO.md): the
  # default-off `experimental-video` feature routes the decoder at the
  # already-C-verified highbd sub-pel / scaled-reference / compound kernels.
  # Nothing in the default run compiles those paths, so without this leg the
  # flag could rot — and a rot there reads as a byte-inert violation of the
  # default envelope the flag is sworn not to touch. Same shape as
  # `test-linux`, one different invocation (the `just test-next-video` recipe).
  test-linux-experimental-video:
    name: linux differential (x86-64, experimental-video)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install C-oracle build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm cmake ninja-build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Cache libaom oracle build
        uses: actions/cache@v6
        with:
          path: upstream/build
          key: libaom-${{ runner.os }}-${{ env.LIBAOM_SHA }}-v3
      - name: Build C libaom oracle (cargo-driven)
        run: cargo build -p zenav1-aom-sys-ref
      - name: Cache conformance corpus
        uses: actions/cache@v6
        with:
          path: conformance/data
          # Both scopes land in conformance/data here, so this leg gets its own
          # key namespace — the shared `conformance-intra-…-v1` key is already
          # populated intra-only (cache keys are immutable once saved), and
          # reusing it would re-fetch the inter vectors on every run.
          key: conformance-intra-inter-${{ runner.os }}-${{ hashFiles('upstream/test/test-data.sha1') }}-v1
      - name: Provision conformance corpus (intra + inter scopes)
        run: |
          python3 xtask/conformance.py --fetch --scope intra
          python3 xtask/conformance.py --fetch --scope inter
      - name: Test workspace (experimental-video on)
        run: cargo nextest run --cargo-profile test-fast --workspace --no-fail-fast --features zenav1-aom-decode/experimental-video
      # The inter conformance gate (conformance_inter) runs inside the suite
      # above, but a passing test's captured output is hidden by nextest. This
      # re-run surfaces just that test's tally so the log proves the inter
      # vectors were exercised non-vacuously (not skipped-by-name). Fast: it
      # reuses the already-built test binary and runs a single filter match.
      - name: Inter conformance tally (non-vacuous inter gate)
        run: cargo nextest run --cargo-profile test-fast -p zenav1-aom-decode --features "experimental-video __internals" --test all conformance_inter --success-output immediate

  # AARCH64 DIFFERENTIAL — the NEON tier's byte-identity gate, WORKSPACE-WIDE.
  #
  # Added 2026-07-25 with the transform NEON landing. Until then the ONLY ARM leg
  # was the pure-Rust `windows-11-arm` portability job below, which builds the
  # crates but runs no differential — so every SIMD kernel's ARM byte-identity
  # rested on a developer's laptop. `de35287` made the C oracle build on
  # aarch64/macOS, which is what makes this leg possible.
  #
  # WIDENED from `-p zenav1-aom-dsp` to `--workspace` on 2026-07-30: KB-ARM-FLOAT
  # is CLOSED. All four roots of the original 15 aarch64 float-differential
  # failures are resolved and `cargo test --profile test-fast --workspace` is
  # green on aarch64-apple-darwin. Progress: 15 -> 4 -> 3 -> 1 -> 0.
  #   * root #1 (11 tests) CLOSED — the oracle was built with clang's default
  #     -ffp-contract=on, so on aarch64 (where fmadd is baseline) it fused
  #     multiply-accumulates that Rust never fuses. Oracle pinned to
  #     -ffp-contract=off. No-op on x86-64: no libaom TU there enables FMA.
  #   * root #2's CNN half (2 tests) CLOSED — arm64 RTCD binds the CNN convolve
  #     with a compile-time #define, so the "C-scalar" oracle was NEON-backed
  #     and there was no pointer to swap. shim/cnn_cscalar.c now compiles
  #     libaom's own cnn.c with that one binding rebound to _c, on every target.
  #   * root #3 (1 test) CLOSED — signed-overflow UB in av1_block_error_c that
  #     aarch64 clang zero-extends (uaddw) and x86-64 sign-extends. The harness
  #     drew the AOM_QUANT_B (quant, quant_shift) pair independently when
  #     libaom consumes them as ONE reciprocal, inflating dqcoeff ~400x past the
  #     spec clamp. Real coefficients cannot reach it. Fixed by deriving the
  #     pair via libaom's own invert_quant, plus a domain guard.
  #   * root #2's hog half (1 test) CLOSED BY STATING THE CONTRACT. The prior
  #     revision of this comment said: "Do NOT resolve it by relaxing the
  #     assertion or by skipping on target_arch." Neither was done, and the
  #     distinction is the point. `av1_nn_predict_avx2` does not exist in an ARM
  #     libaom at all (ml_avx2.c is x86-intrinsic source, never compiled) while
  #     the port's hog_nn_predict deliberately mirrors x86 AVX2 accumulation
  #     order, so bit-equality with it was never a property of this target —
  #     asserting it here asserted against nothing. hog_prune_diff.rs now
  #     carries TWO tests, each stating a different complete contract:
  #       - hog_nn_predict_matches_avx2_and_dispatch — UNCHANGED assertions
  #         (f32 bit equality vs av1_nn_predict_avx2 + RTCD-dispatch identity),
  #         now labelled as the x86-64 contract it always was.
  #       - hog_nn_predict_agrees_with_dispatch_within_one_prec_quantum — the
  #         non-x86 contract: both kernels land EXACTLY on
  #         av1_nn_output_prec_reduce's 1/512 lattice (ml.c:19-25, bound read
  #         off the source), each side's reduced output equals prec_reduce of
  #         its own raw output, the two never differ by more than ONE lattice
  #         step, the `score <= th` prune mask agrees at every production
  #         threshold (measured 0 flips over 160,000 lanes x 5 thresholds), and
  #         the number of lanes that differ at all is pinned at <= 56 so the
  #         divergence cannot grow silently.
  #     No tolerance was widened, no assertion removed, nothing is #[ignore]d,
  #     and no target is left with an unasserted kernel — a skip would leave one.
  #     The ARM test has teeth: perturbing the model bias by ~one quantum makes
  #     it fail with 28 mask-parity flips. See CLAUDE.md KB-ARM-FLOAT.
  # aom-dsp is where every SIMD kernel lives and is green on ARM in both
  # dispatch modes; the workspace adds the aom-encode/aom-decode differentials
  # (which is where all 15 KB-ARM-FLOAT failures lived) and needs the Gate-1
  # conformance corpus, provisioned below exactly as the linux legs do it.
  #
  # Both dispatch modes run, same as the linux pair: on aarch64 the scalar pin
  # only reaches NEON because aom-dsp dev-depends on `archmage/testable_dispatch`
  # (plain `neon` is a compile-time-guaranteed token archmage refuses to disable).
  # That dev-feature is also what makes `for_each_token_permutation` include neon
  # at all — without it the transform differential reports simd_perms=0 and
  # compares the scalar path against itself. See `aom_dsp::dispatch` docs.
  test-macos-aarch64:
    name: aarch64 differential (workspace, ${{ matrix.mode }})
    # Same budget as the two linux differential legs (which measured 21m/36m on
    # --profile test-fast): this leg now runs the same workspace suite, so give
    # it the same ~2.5x headroom and turn a hang into a fast failure rather than
    # a burned 6-hour runner slot.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: default dispatch
            force_scalar: "0"
          - mode: forced-scalar pin
            force_scalar: "1"
    runs-on: macos-latest # macos-latest is aarch64 (Apple silicon)
    env:
      AOM_FORCE_SCALAR: ${{ matrix.force_scalar }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # aom-sys-ref/build.rs hard-requires nasm even on aarch64, where it is
      # unused (libaom's ARM paths are NEON intrinsics) — the tool check predates
      # this leg. cmake is preinstalled on the macOS runner images.
      - name: Install C-oracle build deps
        run: brew list nasm >/dev/null 2>&1 || brew install nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Cache libaom oracle build
        uses: actions/cache@v6
        with:
          path: upstream/build
          key: libaom-${{ runner.os }}-${{ runner.arch }}-${{ env.LIBAOM_SHA }}-v3
      - name: Build C libaom oracle (cargo-driven)
        run: cargo build -p zenav1-aom-sys-ref
      # The aom-dsp differentials are self-contained (generated vectors + the C
      # oracle), but the workspace suite includes conformance_corpus.rs and the
      # aom-encode real-image gates, which fail-loud when conformance/data/ is
      # empty (correct — no silent skip). Provision it the same way the linux
      # legs do: libaom's own sha1-pinned intra-scope vectors, cached on the
      # manifest.
      - name: Cache conformance corpus
        uses: actions/cache@v6
        with:
          path: conformance/data
          key: conformance-intra-${{ runner.os }}-${{ hashFiles('upstream/test/test-data.sha1') }}-v1
      - name: Provision conformance corpus (intra scope)
        run: python3 xtask/conformance.py --fetch --scope intra
      - name: Test workspace (C oracle + scalar + every SIMD tier)
        run: cargo nextest run --cargo-profile test-fast --workspace --no-fail-fast

  # ORG-BAR PLATFORM MATRIX — pure-Rust portability (no C oracle).
  #
  # Invariant A (issue #3): a downstream consumer of any published crate builds
  # with NO C toolchain, NO cmake, NO build.rs — the C libaom oracle is a
  # dev-dependency of the differential harness only, never a normal dependency
  # of a shipping crate. These jobs exercise exactly that surface on the mandated
  # org-bar platforms: build the four published crates (facade + dsp + decode +
  # encode) and the decode-only stack, then run the oracle-free facade tests.
  # This is what catches pointer-width bugs (i686), Windows-aarch64, and macOS-x86
  # regressions in the pure-Rust port. `cargo build`/`test` of these crates pulls
  # in neither aom-sys-ref nor its build.rs, so no cmake/nasm is needed here.
  #
  # The full C-oracle DIFFERENTIAL gate runs on the two linux jobs above, and the
  # aom-dsp differential also runs on aarch64 (macos-latest) in the job above
  # this one. Building libaom for the REMAINING targets in CI (32-bit nasm/cmake
  # for i686; MSVC + AV1 assembly for windows-arm) is a dedicated sub-project, so
  # the differential is gated OFF here — NOT silently skipped: it is simply not
  # invoked on these runners, and this comment says why. macos-15-intel is the
  # most likely next candidate (the aarch64 leg proved the brew-nasm + portable
  # aom-sys-ref build.rs recipe works on macOS).
  # These runners are unverified-pending-CI at landing (labels + toolchains match
  # the org runner set; the first CI run confirms the pure-Rust build is green).
  portability:
    name: portability ${{ matrix.name }} (pure-Rust, no C oracle)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-11-arm
            os: windows-11-arm
          - name: macos-15-intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      # No submodules: the pure-Rust consumer surface never touches upstream/.
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the published crates (no C toolchain)
        run: cargo build -p zenav1-aom -p zenav1-aom-dsp -p zenav1-aom-decode -p zenav1-aom-encode
      - name: Build the decode-only stack (wasm / size-sensitive consumers)
        run: cargo build -p zenav1-aom --no-default-features --features decode
      - name: Test the oracle-free facade
        run: cargo test -p zenav1-aom
      # The content-family coverage gate. Needs neither libaom nor the
      # conformance corpus, runs in seconds, and fails if the harness stops
      # exercising a coding-tool family (which is how a future perf band ends
      # up reading a structural zero — see
      # benchmarks/winperf_family_census_2026-08-03.md).
      - name: Content-family coverage gate (census)
        run: cargo test --release -p zenav1-aom-bench --no-default-features --features census --test content_family_census

  # The public-API surface + crates.io publishability gate. Neither half needs
  # the C oracle, the conformance corpus, or a codec build, so this is the
  # cheapest job in the matrix.
  #
  # WHY IT IS A GATE AND NOT A CONVENTION: the snapshots under docs/public-api/
  # existed from 2026-09-09 and were enforced NOWHERE — not here, not in
  # `just gate-landing` — so they drifted silently. When the enforcement landed
  # on 2026-09-10 every one of the four crates was stale, and the scan's first
  # run found three of them could not have been published at all (intra-workspace
  # path dependencies with no version requirement, which cargo rejects up front).
  # An unenforced snapshot is a document, not a gate.
  #
  # The stakes are asymmetric: a crates.io name is PERMANENT. A broken manifest
  # costs a retry; publishing a crate nobody meant to own, or a surface nobody
  # reviewed, cannot be undone.
  # rustfmt, default style. Fails fast (seconds) so a landing that skipped
  # `just gate-landing` (which runs the same check second) is caught before
  # the 20-minute legs finish. The tree was formatted in one commit on
  # 2026-09-25 (.git-blame-ignore-revs); keep it that way.
  rustfmt:
    name: rustfmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path apidoc/Cargo.toml --check

  # Dependency policy: deny.toml (licences, advisories, no C toolchain on the
  # published path). Seconds; fails ahead of the differential legs.
  cargo-deny:
    name: cargo deny (licences, advisories, bans)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # clippy -D warnings over every target in the harness feature set. Needs the
  # C oracle (the harnesses link it), so it shares the linux leg's oracle cache.
  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install C-oracle build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm cmake ninja-build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache libaom oracle build
        uses: actions/cache@v6
        with:
          path: upstream/build
          key: libaom-${{ runner.os }}-${{ env.LIBAOM_SHA }}-v3
      - run: cargo build -p zenav1-aom-sys-ref
      - run: cargo clippy --profile test-fast --workspace --all-targets --features zenav1-aom-encode/__internals,zenav1-aom-decode/__internals -- -D warnings

  # rustdoc with warnings as errors on the four published crates (what docs.rs
  # will build): broken intra-doc links, missing docs on the consumer surfaces.
  rustdoc:
    name: rustdoc -D warnings (published crates)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p zenav1-aom-dsp -p zenav1-aom-decode -p zenav1-aom-encode -p zenav1-aom

  public-api:
    name: public API surface + crates.io publishability
    runs-on: ubuntu-latest
    steps:
      # No submodules and no oracle: this reads manifests and runs rustdoc.
      - uses: actions/checkout@v7
      # zenutils-apidoc builds rustdoc JSON, which is nightly-only. The
      # publishability scan itself needs no nightly, but one toolchain for the
      # whole job is simpler than splitting it.
      # PINNED, not tracking: rustdoc's auto-trait rendering changes between
      # nightlies (1.100 added `!Freeze !Unpin` lines that 1.99 did not), so a
      # tracking nightly makes the committed snapshot stale on CI while it is
      # current locally -- which is exactly what happened 2026-09-10/11, when
      # this job failed on every run from 52aba0e to 2984ad1 for a two-line
      # rendering difference. The justfile pins the SAME toolchain.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-09
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apidoc
      - name: Snapshots current + every published crate is publishable
        run: ZEN_API_DOC=check ZEN_API_DOC_TOOLCHAIN=nightly-2026-09-09 cargo test --manifest-path apidoc/Cargo.toml

  # i686 is a primary target (32-bit correctness for WASM compatibility + catching
  # pointer-width bugs, per CLAUDE.md). Built via `cross` (Docker) — same pure-Rust,
  # no-C-oracle surface as the native runners above.
  portability-i686:
    name: portability i686-unknown-linux-gnu (pure-Rust, no C oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --locked
      - name: Build the published crates for i686 (32-bit pointer-width)
        run: cross build --target i686-unknown-linux-gnu -p zenav1-aom -p zenav1-aom-dsp -p zenav1-aom-decode -p zenav1-aom-encode
      - name: Build the decode-only stack for i686
        run: cross build --target i686-unknown-linux-gnu -p zenav1-aom --no-default-features --features decode
      - name: Test the oracle-free facade on i686 (under qemu)
        run: cross test --target i686-unknown-linux-gnu -p zenav1-aom
