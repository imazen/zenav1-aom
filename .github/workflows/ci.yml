name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No cancel-in-progress: during a multi-agent wave every commit is a real
# correctness change we want independently verified, so let each run complete
# rather than cancelling on the next push. Concurrent hosted-runner jobs are
# fine; per-commit CI signal is worth the minutes for a conformance project.

env:
  # Pinned libaom oracle commit (see reference/BUILD_CONFIG.md). Bump the cache
  # key salt (-vN) when the pin or build config changes.
  LIBAOM_SHA: 03087864cf4bea6abb0d28f95cf7843511413d8f

jobs:
  test-linux:
    name: linux differential (x86-64)
    runs-on: ubuntu-latest
    # Was 5h47m then 6h00m (GitHub's hard cap, cancelled) on the debug profile.
    # MEASURED on --profile test-fast (run 30404938939): this leg 20m49s (~17x,
    # matching the 10-20x the profile's Cargo.toml comment claims), the
    # scalar-pin leg 36m19s, whole run ~36m instead of 6h — with every job green
    # and no result changed, so the profile is coverage-identical in practice as
    # well as by design. 90 leaves ~2.5x headroom over the slower of the two and
    # turns a future hang into a fast failure instead of a burned 6-hour runner
    # slot that reports as "cancelled" (which reads like a human cancelled it).
    timeout-minutes: 90
    steps:
      # `submodules: recursive` checks out the pinned libaom C oracle at
      # `upstream/`; the cargo-driven aom-sys-ref/build.rs builds it from there.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install C-oracle build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm cmake ninja-build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Every crate links the C libaom oracle via aom-sys-ref, so the whole
      # workspace needs it built. aom-sys-ref/build.rs builds it from the
      # `upstream/` submodule into `upstream/build/`. Cache that build keyed on
      # the pinned commit — after the first run the build.rs SHA stamp skips the
      # rebuild and this restores in seconds.
      - name: Cache libaom oracle build
        uses: actions/cache@v6
        with:
          path: upstream/build
          key: libaom-${{ runner.os }}-${{ env.LIBAOM_SHA }}-v3

      - name: Build C libaom oracle (cargo-driven)
        run: cargo build -p zenav1-aom-sys-ref

      # Deterministically provision the Gate-1 conformance corpus. The workspace
      # conformance test (conformance_corpus.rs) fail-loud-asserts when
      # conformance/data/ is empty — correct (no silent skip), but non-hermetic
      # unless the corpus is actually provisioned. Fetch libaom's own sha1-pinned
      # intra-scope vectors (name+sha1 from the `upstream/` submodule's
      # test-data.sha1 manifest; bytes from storage.googleapis.com/aom-test-data).
      # Cached, keyed on the manifest, so later runs restore in seconds and
      # re-verify without re-downloading.
      - name: Cache conformance corpus
        uses: actions/cache@v6
        with:
          path: conformance/data
          key: conformance-intra-${{ runner.os }}-${{ hashFiles('upstream/test/test-data.sha1') }}-v1
      - name: Provision conformance corpus (intra scope)
        run: python3 xtask/conformance.py --fetch --scope intra

      # archmage/magetypes (SIMD dispatch) come from crates.io ("0.9.27") —
      # the former absolute-path dep + CI clone workaround was migrated per
      # its TODO (Gate-3 SIMD work needs ONE archmage instance workspace-wide
      # so the AOM_FORCE_SCALAR token pin reaches every kernel crate).

      - name: Test workspace (differential vs C oracle)
        run: cargo test --profile test-fast --workspace --no-fail-fast

  # SCALAR-PIN mode (Gate-3 parity rule 3): AOM_FORCE_SCALAR disables every
  # archmage SIMD token process-wide (aom_dsp::dispatch), so every kernel
  # dispatch falls through to `_scalar` = the transcribed C port, verbatim.
  # The FULL suite passing here proves SIMD work left the scalar path
  # untouched. Locally: `just test-scalar`.
  test-linux-scalar-pinned:
    name: linux differential (forced-scalar pin)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AOM_FORCE_SCALAR: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install C-oracle build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm cmake ninja-build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache libaom oracle build
        uses: actions/cache@v6
        with:
          path: upstream/build
          key: libaom-${{ runner.os }}-${{ env.LIBAOM_SHA }}-v3
      - name: Build C libaom oracle (cargo-driven)
        run: cargo build -p zenav1-aom-sys-ref
      - name: Cache conformance corpus
        uses: actions/cache@v6
        with:
          path: conformance/data
          key: conformance-intra-${{ runner.os }}-${{ hashFiles('upstream/test/test-data.sha1') }}-v1
      - name: Provision conformance corpus (intra scope)
        run: python3 xtask/conformance.py --fetch --scope intra
      - name: Test workspace under the scalar pin
        run: cargo test --profile test-fast --workspace --no-fail-fast

  # AARCH64 DIFFERENTIAL — the NEON tier's byte-identity gate.
  #
  # Added 2026-07-25 with the transform NEON landing. Until then the ONLY ARM leg
  # was the pure-Rust `windows-11-arm` portability job below, which builds the
  # crates but runs no differential — so every SIMD kernel's ARM byte-identity
  # rested on a developer's laptop. `de35287` made the C oracle build on
  # aarch64/macOS, which is what makes this leg possible.
  #
  # SCOPED TO aom-dsp ON PURPOSE, and this is not a silent skip. KB-ARM-FLOAT's
  # root #1 (oracle FP contraction) is FIXED as of 2026-07-28 — the oracle now
  # builds with `-ffp-contract=off` and 11 of the 15 float differentials pass —
  # but `cargo test --workspace` on aarch64 still fails FOUR, under two roots
  # that are unrelated to SIMD and unrelated to each other:
  #   * root #2 (3 tests: cnn_partition_cnn_diff, cnn_partition_decision_diff,
  #     hog_prune_diff) — arm64 RTCD binds av1_nn_predict / the CNN convolve to
  #     _neon with a compile-time #define, so the "C-scalar" oracle isn't scalar
  #     and there is no pointer to swap; hog additionally pins the port to x86
  #     AVX2 accumulation order, which no ARM oracle can reproduce;
  #   * root #3 (1 test: intra_rd_pick_diff) — signed-overflow UB in
  #     av1_block_error_c that aarch64 clang zero-extends (uaddw) and x86-64
  #     sign-extends; an integer harness-input-range issue, not float at all.
  # See CLAUDE.md KB-ARM-FLOAT for the measurements. aom-dsp is where every SIMD
  # kernel lives and is 352/352 green on ARM in both dispatch modes. WIDEN THIS
  # TO --workspace THE MOMENT ROOTS #2 AND #3 CLOSE; do not widen it by relaxing
  # those tests or by skipping them on target_arch.
  #
  # Both dispatch modes run, same as the linux pair: on aarch64 the scalar pin
  # only reaches NEON because aom-dsp dev-depends on `archmage/testable_dispatch`
  # (plain `neon` is a compile-time-guaranteed token archmage refuses to disable).
  # That dev-feature is also what makes `for_each_token_permutation` include neon
  # at all — without it the transform differential reports simd_perms=0 and
  # compares the scalar path against itself. See `aom_dsp::dispatch` docs.
  test-macos-aarch64:
    name: aarch64 differential (aom-dsp, ${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: default dispatch
            force_scalar: "0"
          - mode: forced-scalar pin
            force_scalar: "1"
    runs-on: macos-latest # macos-latest is aarch64 (Apple silicon)
    env:
      AOM_FORCE_SCALAR: ${{ matrix.force_scalar }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # aom-sys-ref/build.rs hard-requires nasm even on aarch64, where it is
      # unused (libaom's ARM paths are NEON intrinsics) — the tool check predates
      # this leg. cmake is preinstalled on the macOS runner images.
      - name: Install C-oracle build deps
        run: brew list nasm >/dev/null 2>&1 || brew install nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache libaom oracle build
        uses: actions/cache@v6
        with:
          path: upstream/build
          key: libaom-${{ runner.os }}-${{ runner.arch }}-${{ env.LIBAOM_SHA }}-v3
      - name: Build C libaom oracle (cargo-driven)
        run: cargo build -p zenav1-aom-sys-ref
      # The aom-dsp differentials are self-contained (generated vectors + the C
      # oracle); they do not read conformance/data, so no corpus provisioning.
      - name: Test aom-dsp (C oracle + scalar + every SIMD tier)
        run: cargo test -p zenav1-aom-dsp --no-fail-fast

  # ORG-BAR PLATFORM MATRIX — pure-Rust portability (no C oracle).
  #
  # Invariant A (issue #3): a downstream consumer of any published crate builds
  # with NO C toolchain, NO cmake, NO build.rs — the C libaom oracle is a
  # dev-dependency of the differential harness only, never a normal dependency
  # of a shipping crate. These jobs exercise exactly that surface on the mandated
  # org-bar platforms: build the four published crates (facade + dsp + decode +
  # encode) and the decode-only stack, then run the oracle-free facade tests.
  # This is what catches pointer-width bugs (i686), Windows-aarch64, and macOS-x86
  # regressions in the pure-Rust port. `cargo build`/`test` of these crates pulls
  # in neither aom-sys-ref nor its build.rs, so no cmake/nasm is needed here.
  #
  # The full C-oracle DIFFERENTIAL gate runs on the two linux jobs above, and the
  # aom-dsp differential also runs on aarch64 (macos-latest) in the job above
  # this one. Building libaom for the REMAINING targets in CI (32-bit nasm/cmake
  # for i686; MSVC + AV1 assembly for windows-arm) is a dedicated sub-project, so
  # the differential is gated OFF here — NOT silently skipped: it is simply not
  # invoked on these runners, and this comment says why. macos-15-intel is the
  # most likely next candidate (the aarch64 leg proved the brew-nasm + portable
  # aom-sys-ref build.rs recipe works on macOS).
  # These runners are unverified-pending-CI at landing (labels + toolchains match
  # the org runner set; the first CI run confirms the pure-Rust build is green).
  portability:
    name: portability ${{ matrix.name }} (pure-Rust, no C oracle)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-11-arm
            os: windows-11-arm
          - name: macos-15-intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      # No submodules: the pure-Rust consumer surface never touches upstream/.
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the published crates (no C toolchain)
        run: cargo build -p zenav1-aom -p zenav1-aom-dsp -p zenav1-aom-decode -p zenav1-aom-encode
      - name: Build the decode-only stack (wasm / size-sensitive consumers)
        run: cargo build -p zenav1-aom --no-default-features --features decode
      - name: Test the oracle-free facade
        run: cargo test -p zenav1-aom

  # i686 is a primary target (32-bit correctness for WASM compatibility + catching
  # pointer-width bugs, per CLAUDE.md). Built via `cross` (Docker) — same pure-Rust,
  # no-C-oracle surface as the native runners above.
  portability-i686:
    name: portability i686-unknown-linux-gnu (pure-Rust, no C oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --locked
      - name: Build the published crates for i686 (32-bit pointer-width)
        run: cross build --target i686-unknown-linux-gnu -p zenav1-aom -p zenav1-aom-dsp -p zenav1-aom-decode -p zenav1-aom-encode
      - name: Build the decode-only stack for i686
        run: cross build --target i686-unknown-linux-gnu -p zenav1-aom --no-default-features --features decode
      - name: Test the oracle-free facade on i686 (under qemu)
        run: cross test --target i686-unknown-linux-gnu -p zenav1-aom
