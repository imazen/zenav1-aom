[package]
name = "zenav1-aom"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust, bit-exact libaom v3.14.1 AV1 codec — thin facade re-exporting the DSP kernels plus the (feature-gated) decoder and encoder as one dependency."

# Keep snapshot docs, the apidoc runner and repo-local session files
# out of the published crate.
exclude = [
    "docs/",
    "apidoc/",
    "CLAUDE.md",
    "FEEDBACK.md",
    ".claude/",
    ".github/",
    "justfile",
]
[lib]
name = "zenav1_aom"

[dependencies]
# The consolidated kernels are always present; decode/encode are feature-gated
# so size-sensitive consumers can pull a decode-only stack (encoder never built).
zenav1-aom-dsp = { path = "../aom-dsp", version = "0.0.1", default-features = false }
zenav1-aom-decode = { path = "../aom-decode", version = "0.0.1", optional = true }
zenav1-aom-encode = { path = "../aom-encode", version = "0.0.1", optional = true }

[features]
# AVX-512 tiers, forwarded all the way down so a consumer of the FACADE can
# reach the knob too. Default-ON: unchanged behaviour, runtime dispatch still
# decides what executes.
default = ["decode", "encode", "avx512"]
avx512 = [
    "zenav1-aom-dsp/avx512",
    "zenav1-aom-decode?/avx512",
    "zenav1-aom-encode?/avx512",
]
decode = ["dep:zenav1-aom-decode"]
encode = ["dep:zenav1-aom-encode"]
