[package]
name = "zenav1-aom-encode"
version = "0.0.1"
edition = "2024"
license.workspace = true
description = "Encoder composition layer for aom-rs: av1_xform_quant (forward transform + quantize + entropy context), bit-exact vs libaom."

[lib]
# Short lib name kept after the package rename to zenav1-aom-encode.
name = "aom_encode"

[dependencies]
# Consolidated DSP/entropy kernels (was: aom-transform/quant/txb/recon/entropy/
# dist/intra/convolve/loopfilter/cdef — folded into aom-dsp per GitHub #2). The
# reuse notes that lived here (subpel filter tables for aom_upsampled_pred;
# loop_filter_frame as the LF-search trial primitive; the CDEF-search kernels)
# still apply — those kernels are now aom_dsp::{convolve,loopfilter,cdef}.
zenav1-aom-dsp = { path = "../aom-dsp" }

[features]
# Forwards `aom_dsp/census` and adds this crate's own hook (the coded-leaf
# counter in `pack::pack_leaf`). DEFAULT OFF: a census build is not a timing
# build. See `aom_dsp::census`.
census = ["zenav1-aom-dsp/census"]

[dev-dependencies]
zenav1-aom-sys-ref = { path = "../aom-sys-ref" }
# Read-only use for decode-diff diagnostics only (see
# tests/decode_diff_noise_case.rs) -- aom-decode itself is owned by the
# decoder track; this crate never modifies it. dev-dependency only, so this
# does not create a cycle in the library build graph (aom-decode's own
# [dependencies] on aom-encode only applies when building aom-decode itself;
# test binaries here are a separate compilation unit).
zenav1-aom-decode = { path = "../aom-decode" }
# AVIF container muxer -- used ONLY by the `avif_parity` test (Gate 4,
# zenavif integration): wraps the port's byte-exact AV1 OBU frame into an
# AVIF still, which the harness then round-trips (parse container -> extract
# the coded AV1 -> byte-compare) and decodes (via aom-decode). Dev-dependency
# only; never linked into the aom-encode library. Pinned to the SAME git rev
# the zenavif codec crate consumes (imazen/zenavif consumes it via this exact
# rev in its [patch.crates-io]; zenavif-serialize 0.2.0 is unpublished).
zenavif-serialize = { git = "https://github.com/imazen/zenavif-serialize", rev = "4c90d4dd02ef1684fa2230c6aaa2b5ef51e6a926" }
# AVIF container PARSER -- used ONLY by the `standalone_avif_parse_readback`
# test (issue #15's DoD: "validated by its own decode plus a zenavif-parse
# read-back"). Independent of `avif_parity`'s hand-rolled `extract_mdat_
# payload` box walker on purpose -- the read-back needs a genuinely separate
# parser so it cannot share blind spots with the muxer it is checking.
# Dev-dependency only; never linked into the aom-encode library. `tools/
# avif-extract` isolates this same crate into its own workspace/lockfile for
# a DIFFERENT reason (a standalone multi-purpose extraction CLI, not a test
# dependency) -- `zenavif-serialize` above is the precedent for taking a
# zenavif-family crate as a direct dev-dependency here.
zenavif-parse = "0.6.2"
