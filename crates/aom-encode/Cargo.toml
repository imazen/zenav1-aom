[package]
name = "zenav1-aom-encode"
version = "0.0.1"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Encoder composition layer for aom-rs: av1_xform_quant (forward transform + quantize + entropy context), bit-exact vs libaom."

# Keep snapshot docs, the apidoc runner and repo-local session files
# out of the published crate.
exclude = [
    "docs/",
    "apidoc/",
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".github/",
    "justfile",
]
[lib]
# Short lib name kept after the package rename to zenav1-aom-encode.
name = "aom_encode"

[dependencies]
# KB-PERF-43: `TxbWinner` lists for the transform-search walk. MEASURED on the
# shipping-preset cell: `txfm_rd_in_plane_intra` runs 1,359,984 times per 1 MP
# encode and every call allocated one `Vec` — 60.5 % of all TEMPORARY
# allocations in the encoder. The walk's length distribution is 1 txb 50.6 %,
# 2 txbs 35.6 %, 4 txbs 13.8 %, and NOTHING above 4, so a 4-element inline
# capacity removes 100 % of them. `tinyvec` rather than `smallvec` because it is
# itself `#![forbid(unsafe_code)]`, matching this workspace's policy; the cost
# is `unsafe` inside the dependency (not in this crate).
#
# `smallvec` rather than `tinyvec`, MEASURED not assumed — see the record's A/B.
smallvec = "1"
# Consolidated DSP/entropy kernels (was: aom-transform/quant/txb/recon/entropy/
# dist/intra/convolve/loopfilter/cdef — folded into aom-dsp per GitHub #2). The
# reuse notes that lived here (subpel filter tables for aom_upsampled_pred;
# loop_filter_frame as the LF-search trial primitive; the CDEF-search kernels)
# still apply — those kernels are now aom_dsp::{convolve,loopfilter,cdef}.
zenav1-aom-dsp = { path = "../aom-dsp", version = "0.0.1", default-features = false }
# Cooperative cancellation (stop token) — zero-dep, no_std. Same version the
# decoder depends on so the `dyn Stop` vtable is the same trait; a mismatched
# major would not type-check across the crate boundary.
enough = "0.4.4"

[features]
# Forwards `aom_dsp/census` and adds this crate's own hook (the coded-leaf
# counter in `pack::pack_leaf`). DEFAULT OFF: a census build is not a timing
# build. See `aom_dsp::census`.
# AVX-512 tiers, forwarded from `zenav1-aom-dsp`. Default-ON so behaviour is
# unchanged; a consumer that does not want AVX-512 codegen (compile time, and
# downclocking on some parts) can now actually reach the knob with
# `--no-default-features`, which it could NOT before -- this crate depended on
# aom-dsp with its defaults, so the switch was unreachable from outside.
default = ["avx512"]
avx512 = ["zenav1-aom-dsp/avx512"]
census = ["zenav1-aom-dsp/census"]
# Exposes this crate's 76 implementation modules as `pub`. DEFAULT OFF: the
# external API is `key_frame` alone. In-workspace crates that reach inside
# declare it, and a `--workspace` build unifies it on, so the harness still
# runs. NOT a never-disabled feature: `cargo build -p zenav1-aom-encode`
# genuinely hides them (E0603), which is the whole point.
__internals = []

[dev-dependencies]
zenav1-aom-sys-ref = { path = "../aom-sys-ref" }
# Read-only use for decode-diff diagnostics only (see
# tests/decode_diff_noise_case.rs) -- aom-decode itself is owned by the
# decoder track; this crate never modifies it. dev-dependency only, so this
# does not create a cycle in the library build graph (aom-decode's own
# [dependencies] on aom-encode only applies when building aom-decode itself;
# test binaries here are a separate compilation unit).
zenav1-aom-decode = { path = "../aom-decode", features = ["__internals"] }
# AVIF container muxer -- used ONLY by the `avif_parity` test (Gate 4,
# zenavif integration): wraps the port's byte-exact AV1 OBU frame into an
# AVIF still, which the harness then round-trips (parse container -> extract
# the coded AV1 -> byte-compare) and decodes (via aom-decode). Dev-dependency
# only; never linked into the aom-encode library. Pinned to the SAME git rev
# the zenavif codec crate consumes (imazen/zenavif consumes it via this exact
# rev in its [patch.crates-io]; zenavif-serialize 0.2.0 is unpublished).
zenavif-serialize = { git = "https://github.com/imazen/zenavif-serialize", rev = "4c90d4dd02ef1684fa2230c6aaa2b5ef51e6a926" }
# AVIF container PARSER -- used ONLY by the `standalone_avif_parse_readback`
# test (issue #15's DoD: "validated by its own decode plus a zenavif-parse
# read-back"). Independent of `avif_parity`'s hand-rolled `extract_mdat_
# payload` box walker on purpose -- the read-back needs a genuinely separate
# parser so it cannot share blind spots with the muxer it is checking.
# Dev-dependency only; never linked into the aom-encode library. `tools/
# avif-extract` isolates this same crate into its own workspace/lockfile for
# a DIFFERENT reason (a standalone multi-purpose extraction CLI, not a test
# dependency) -- `zenavif-serialize` above is the precedent for taking a
# zenavif-family crate as a direct dev-dependency here.
zenavif-parse = "0.6.2"

# The consolidated harness reaches into this crate's internals, so it requires
# the `__internals` feature. `internals_feature_guard` is deliberately NOT
# listed here: it stays unconditional so a build without the feature FAILS
# loudly instead of reporting green with zero integration tests (KB-42's shape).
# The explicit `path` is load-bearing -- cargo resolves `name = "all"` to
# `tests/all.rs`, NOT `tests/all/main.rs`, and without it this section silently
# does nothing while the harness builds anyway.
[[test]]
name = "all"
path = "tests/all/main.rs"
required-features = ["__internals"]
