[package]
name = "xtool"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
image = { version = "0.25.9", default-features = false, features = ["png"] }
fast-ssim2 = { path = "../../../../fast-ssim2/fast-ssim2", features = ["imgref"] }
butteraugli = { path = "../../../../butteraugli/butteraugli" }
imgref = "1.11.0"
rgb = "0.8.52"
# The port's own decoder, so EVERY arm is decoded by ONE implementation and
# format/bit-depth differences between encoders cannot become scoring artifacts.
zenav1-aom-decode = { path = "../../../crates/aom-decode" }

[profile.release]
opt-level = 3
