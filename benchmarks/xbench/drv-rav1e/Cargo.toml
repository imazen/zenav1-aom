[package]
name = "drv-rav1e"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The rav1e fork (sibling repo, built read-only). default-features off so the
# CLI binaries / muxers are not dragged in — the library encoder is what is
# under measurement.
zenrav1e = { path = "../../../../zenrav1e", default-features = false }

[profile.release]
opt-level = 3
